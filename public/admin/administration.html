<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Administration</title>
    <style>
        .logout-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        .cell-truncate {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .cell-truncate-id {
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        th, td { padding: 6px 6px !important; font-size: 13px; }
        #tableBody td { vertical-align: middle; }
        .action-icon { display: inline-flex; align-items: center; }
    </style>
</head>
<body>
<div class="relative w-full min-h-screen bg-gray-100 flex flex-col items-center justify-center">
    <div class="logout-button mb-4">
        <button id="logoutBtn" class="flex items-center gap-4 w-full bg-red-500 px-6 py-3 rounded-md font-medium text-white shadow-md hover:bg-red-600 transition">
            <svg xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Déconnexion
        </button>
    </div>

    <div class="w-full max-w-4xl bg-white p-4 rounded-lg shadow-md">
        <table class="w-full border border-gray-300 rounded-lg">
            <thead class="bg-gray-100">
            <tr>
                <th class="text-left font-semibold text-gray-600">ID</th>
                <th class="text-left font-semibold text-gray-600">Nom</th>
                <th class="text-center font-semibold text-gray-600">IP</th>
                <th class="text-center font-semibold text-gray-600">Date</th>
                <th class="text-center font-semibold text-gray-600">Taille</th>
                <th class="text-center font-semibold text-gray-600">Actions</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pagination" class="flex justify-center space-x-2 mt-4"></div>
    </div>
</div>

<script>
    function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(';');
        for(let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
        }
        return null;
    }

    function eraseCookie(name) {
        document.cookie = name + '=; Max-Age=-99999999; path=/';
    }

    function getResponseMessage(data) {
        if (typeof data === 'string') {
            try { const p = JSON.parse(data); return p.message || data; } catch { return data; }
        }
        if (data && typeof data.message === 'string') return data.message;
        return '';
    }

    function formatSize(bytes) {
        if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + ' Go';
        if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' Mo';
        if (bytes >= 1024) return (bytes / 1024).toFixed(2) + ' Ko';
        return bytes + ' o';
    }

    function formatDate(value) {
        if (!value) return '—';
        try {
            var d = new Date(value);
            return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        } catch(e) { return value; }
    }

    const username = getCookie('admin_username');
    const password = getCookie('admin_password');

    if (!username || !password) {
        window.location.href = '/admin/login';
    }

    document.getElementById('logoutBtn').addEventListener('click', function() {
        eraseCookie('admin_username');
        eraseCookie('admin_password');
        window.location.href = '/admin/login';
    });

    let currentPage = 1;
    const itemsPerPage = 10;

    function fetchFiles(page) {
        const offset = (page - 1) * itemsPerPage;
        currentPage = page;

        fetch('/admin/api?offset=' + offset + '&limit=' + itemsPerPage, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'list_files', username: username, password: password })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data && data.message) {
                console.error(getResponseMessage(data));
                return;
            }
            if (Array.isArray(data)) {
                renderTable(data, page);
            }
        })
        .catch(function(err) { console.error(err); });
    }

    function renderTable(files, page) {
        var tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        files.forEach(function(item) {
            var row = document.createElement('tr');
            row.classList.add('border-t', 'border-gray-200');

            row.innerHTML =
                '<td class="text-gray-800 cell-truncate-id" title="' + escapeAttr(item.id) + '">' + escapeHtml(item.id) + '</td>' +
                '<td class="text-gray-800 cell-truncate" title="' + escapeAttr(item.file_name) + '">' + escapeHtml(item.file_name) + '</td>' +
                '<td class="text-gray-800 text-center">' + escapeHtml(item.ip_addr) + '</td>' +
                '<td class="text-gray-800 text-center">' + formatDate(item.date) + '</td>' +
                '<td class="text-gray-800 text-center">' + formatSize(item.file_size) + '</td>' +
                '<td class="text-center whitespace-nowrap">' +
                    '<a href="#" class="action-icon" onclick="event.preventDefault();downloadFile(\'' + item.id + '\')" title="Télécharger">' +
                        '<svg xmlns="http://www.w3.org/2000/svg" class="text-gray-600 hover:text-indigo-600" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                          '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>' +
                        '</svg>' +
                    '</a>' +
                    '<a href="#" class="action-icon" onclick="event.preventDefault();renameFile(\'' + item.id + '\')" title="Renommer">' +
                        '<svg xmlns="http://www.w3.org/2000/svg" class="text-gray-600 hover:text-yellow-600" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                          '<path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10.4 12.6a2 2 0 1 1 3 3L8 21l-4 1 1-4Z"/>' +
                        '</svg>' +
                    '</a>' +
                    '<a href="#" class="action-icon" onclick="event.preventDefault();changeFileID(\'' + item.id + '\')" title="Changer l\'identifiant">' +
                        '<svg xmlns="http://www.w3.org/2000/svg" class="text-gray-600 hover:text-blue-600" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                          '<path d="M16 10h2"/><path d="M16 14h2"/><path d="M6.17 15a3 3 0 0 1 5.66 0"/><circle cx="9" cy="11" r="2"/><rect x="2" y="5" width="20" height="14" rx="2"/>' +
                        '</svg>' +
                    '</a>' +
                    '<a href="#" class="action-icon" onclick="event.preventDefault();deleteFile(\'' + item.id + '\')" title="Supprimer">' +
                        '<svg xmlns="http://www.w3.org/2000/svg" class="text-gray-900 hover:text-red-600" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                          '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' +
                        '</svg>' +
                    '</a>' +
                '</td>';

            tbody.appendChild(row);
        });

        renderPagination(files, page);
    }

    function renderPagination(files, page) {
        var paginationDiv = document.getElementById('pagination');
        paginationDiv.innerHTML = '';

        var prevBtn = document.createElement('button');
        prevBtn.textContent = 'Précédent';
        prevBtn.className = 'px-4 py-2 bg-gray-300 rounded-md text-sm font-medium hover:bg-gray-400 transition' + (page <= 1 ? ' opacity-50 cursor-not-allowed' : ' cursor-pointer');
        if (page > 1) {
            prevBtn.addEventListener('click', function() { fetchFiles(page - 1); });
        }
        paginationDiv.appendChild(prevBtn);

        var pageLabel = document.createElement('span');
        pageLabel.className = 'px-4 py-2 text-sm text-gray-700 font-semibold';
        pageLabel.textContent = 'Page ' + page;
        paginationDiv.appendChild(pageLabel);

        var nextBtn = document.createElement('button');
        nextBtn.textContent = 'Suivant';
        nextBtn.className = 'px-4 py-2 bg-gray-300 rounded-md text-sm font-medium hover:bg-gray-400 transition cursor-pointer';
        nextBtn.addEventListener('click', function() { fetchFiles(page + 1); });
        paginationDiv.appendChild(nextBtn);
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function deleteFile(fileID) {
        if (!confirm('Êtes-vous sûr de vouloir supprimer ce fichier ?')) return;
        fetch('/admin/api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'delete', username: username, password: password, fileID: fileID })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            console.log(getResponseMessage(data));
            fetchFiles(currentPage);
        })
        .catch(function(err) { console.error(err); });
    }

    function renameFile(fileID) {
        var newName = prompt('Nouveau nom pour le fichier ' + fileID + ' :');
        if (!newName) return;
        fetch('/admin/api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'rename', username: username, password: password, fileID: fileID, newFileName: newName })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            console.log(getResponseMessage(data));
            fetchFiles(currentPage);
        })
        .catch(function(err) { console.error(err); });
    }

    function changeFileID(fileID) {
        var newID = prompt('Nouvel identifiant pour ' + fileID + ' :');
        if (!newID) return;
        fetch('/admin/api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'change_id', username: username, password: password, fileID: fileID, newFileID: newID })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            console.log(getResponseMessage(data));
            fetchFiles(currentPage);
        })
        .catch(function(err) { console.error(err); });
    }

    function downloadFile(fileID) {
        fetch('/admin/api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'download', username: username, password: password, fileID: fileID })
        })
        .then(function(res) {
            if (res.ok) {
                window.location.href = '/admin/api?download=' + fileID;
            } else {
                res.json().then(function(data) {
                    alert(getResponseMessage(data) || 'Erreur lors du téléchargement');
                });
            }
        })
        .catch(function(err) { console.error(err); });
    }

    document.addEventListener('DOMContentLoaded', function() {
        fetchFiles(1);
    });
</script>
</body>
</html>
