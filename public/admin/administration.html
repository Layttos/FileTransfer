<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <title>Administration</title>
    <style>
        .logout-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
<div class="relative w-full min-h-screen bg-gray-100 flex flex-col items-center justify-center">
    <div class="logout-button mb-4">
        <button id="logoutBtn" class="flex items-center gap-4 w-full bg-red-500 px-6 py-3 rounded-md font-medium text-white shadow-md hover:bg-red-600 transition">
            <svg xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Déconnexion
        </button>
    </div>

    <div class="w-full max-w-5xl bg-white p-6 rounded-lg shadow-md overflow-y-auto max-h-[1000px]">
        <table class="w-full table-fixed border border-gray-300 rounded-lg">
            <thead class="bg-gray-100">
            <tr>
                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Identifiants</th>
                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Nom du fichier</th>
                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Chemins d'accès</th>
                <th class="px-6 py-3 text-center text-sm font-semibold text-gray-600">Taille</th>
                <th class="px-6 py-3 text-center text-sm font-semibold text-gray-600">Actions réalistes</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <!-- Les données seront injectées ici -->
            </tbody>
        </table>
        <div id="pagination" class="flex justify-center space-x-2 mt-4"></div>
    </div>
</div>


<script>

    const mainURL = "https://file.titino.app"

    function setCookie(name, value, days) {
        let expires = "";
        if (days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/";
    }

    function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(';');
        for(let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
        }
        return null;
    }

    function eraseCookie(name) {
        document.cookie = name + '=; Max-Age=-99999999; path=/';
    }

    function logout() {
        eraseCookie('admin_username');
        eraseCookie('admin_password');
        window.location.href = mainURL;
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);

    if(!getCookie('admin_username') || !getCookie('admin_password')) {
        window.location.href = mainURL;
    }
    let jsonData;

    function renameIdentifierBox(identifier) {
        const newName = prompt(`Nouvel identifiant pour ${identifier} : `);
        if(newName) {
            fetch(`${mainURL}/admin/api?rename=${identifier}&newName=${newName}`)
                .then(response => {
                    if(!response.ok) {
                        throw console.log("Erreur lors de la récupération des données");
                    }
                    return response.json()
                }).then(data => {
                console.log(data);
            }).catch(() => console.log("c'est la merde"));
        }
        setTimeout(() => {
            window.location.reload(true);
        }, 200);
    }
    function deleteRow(button) {
        if(confirm("Êtes-vous sûr de vouloir supprimer ce fichier ?")) {
            const identifier = button.closest("tr").querySelector("td").textContent;
            fetch(`${mainURL}/admin/api?suppr=${identifier}`)
                .then(response => {
                    if(!response.ok) {
                        throw console.log("Erreur lors de la récupération des données");
                    }
                    return response.json()
                }).then(data => {
                console.log(data);
            }).catch(() => console.log("c'est la merde"));
            setTimeout(() => {
                window.location.reload(true);
            }, 200);
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const tableBody = document.getElementById("tableBody");
        const paginationDiv = document.getElementById("pagination");
        let jsonData = [];
        let itemsPerPage = 10;
        let currentPage = 1;

        fetch(`${mainURL}admin/api?listFiles=true`)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erreur lors de la récupération des données");
                }
                return response.json();
            })
            .then(data => {
                jsonData = Object.values(data);
                displayData();
            })
            .catch(() => console.log("Erreur lors du chargement des fichiers"));

        function displayData() {
            tableBody.innerHTML = "";

            let start = (currentPage - 1) * itemsPerPage;
            let end = start + itemsPerPage;
            let displayedData = jsonData.slice(start, end);

            displayedData.forEach(item => {
                let row = document.createElement("tr");
                row.classList.add("border-t", "border-gray-200");

                row.innerHTML = `
                <td class="px-6 py-4 text-gray-800">${item.identifier}</td>
                <td class="px-6 py-4 text-gray-800">${item.filename}</td>
                <td class="px-6 py-4 text-gray-800 truncate max-w-[300px]" title="${item.path.replaceAll("\\\\", "\\")}">${item.path.replaceAll("\\\\", "\\")}</td>
                <td class="px-6 py-4 text-gray-800 text-center truncate max-w-[300px]">${item.size}</td>
                <td class="px-6 py-4 text-center flex items-center justify-center space-x-4">
                    <a href="http://localhost:3000/admin/api?download=${item.identifier}">
                        <svg xmlns="http://www.w3.org/2000/svg" class="text-gray-600 hover:underline hover:text-indigo-600" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                          <polyline points="7 10 12 15 17 10"/>
                          <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </a>
                    <a id="renameIdentifier" onclick="renameIdentifierBox('${item.identifier}')">
                        <svg xmlns="http://www.w3.org/2000/svg" class="text-gray-600 hover:underline hover:text-yellow-600" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M12 20h9"/>
                          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                    </a>
                    <a id="deleteIdentifier" onclick="deleteRow(this)">
                        <svg xmlns="http://www.w3.org/2000/svg" class="text-gray-900 hover:underline hover:text-red-600" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <line x1="18" y1="6" x2="6" y2="18"/>
                          <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </a>
                </td>
            `;

                tableBody.appendChild(row);
            });

            updatePagination();
        }

        function updatePagination() {
            paginationDiv.innerHTML = ""; // Effacer l'affichage actuel
            let totalPages = Math.ceil(jsonData.length / itemsPerPage);

            let prevButton = document.createElement("button");
            prevButton.innerText = "Précédent";
            prevButton.disabled = currentPage === 1;
            prevButton.className = "px-3 py-2 bg-gray-300 rounded-md hover:bg-gray-400 transition";
            prevButton.addEventListener("click", function () {
                if (currentPage > 1) {
                    currentPage--;
                    displayData();
                }
            });
            paginationDiv.appendChild(prevButton);

            for (let i = 1; i <= totalPages; i++) {
                let button = document.createElement("button");
                button.innerText = i;
                button.className = `px-3 py-2 rounded-md ${i === currentPage ? "bg-blue-500 text-white" : "bg-gray-300 hover:bg-gray-400 transition "}`;
                button.addEventListener("click", function () {
                    currentPage = i;
                    displayData();
                });

                paginationDiv.appendChild(button);
            }

            let nextButton = document.createElement("button");
            nextButton.innerText = "Suivant";
            nextButton.disabled = currentPage === totalPages;
            nextButton.className = "px-3 py-2 bg-gray-300 rounded-md hover:bg-gray-400 transition";
            nextButton.addEventListener("click", function () {
                if (currentPage < totalPages) {
                    currentPage++;
                    displayData();
                }
            });
            paginationDiv.appendChild(nextButton);
        }
    });

</script>
</body>
</html>
