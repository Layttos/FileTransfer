<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>Se connecter | Administration</title>
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html[data-theme="light"] body { background-color: #f3f4f6 !important; color: #111827 !important; }
        html[data-theme="dark"] body { background-color: #0f172a !important; color: #f8fafc !important; }
        html[data-theme="light"] .login-card { background-color: #ffffff !important; }
        html[data-theme="dark"] .login-card { background-color: #1f2937 !important; }
        html[data-theme="light"] .login-title { color: #111827 !important; }
        html[data-theme="dark"] .login-title { color: #f8fafc !important; }
        html[data-theme="light"] .login-subtitle { color: #4b5563 !important; }
        html[data-theme="dark"] .login-subtitle { color: #cbd5e1 !important; }
        html[data-theme="light"] #username,
        html[data-theme="light"] #password { background-color: #ffffff !important; color: #111827 !important; border-color: #d1d5db !important; }
        html[data-theme="dark"] #username,
        html[data-theme="dark"] #password { background-color: #111827 !important; color: #f8fafc !important; border-color: #4b5563 !important; }
        html[data-theme="light"] #connect-msg { color: #dc2626 !important; }
        html[data-theme="dark"] #connect-msg { color: #fca5a5 !important; }
        html[data-theme="light"] #submit-btn { background-color: #4f46e5 !important; color: #ffffff !important; }
        html[data-theme="dark"] #submit-btn { background-color: #818cf8 !important; color: #111827 !important; }
        html[data-theme="light"] .login-footer { color: #111827 !important; }
        html[data-theme="dark"] .login-footer { color: #f8fafc !important; }
        html[data-theme="light"] #themeToggle { background-color: #000000 !important; color: #ffffff !important; }
        html[data-theme="dark"] #themeToggle { background-color: #ffffff !important; color: #000000 !important; }
    </style>
</head>
<body class="min-h-screen bg-gray-100 text-gray-900 transition-colors duration-200 dark:bg-gray-900 dark:text-gray-100">

<button id="themeToggle" type="button" class="fixed bottom-4 right-4 z-50 flex h-14 w-14 items-center justify-center rounded-full shadow-xl ring-1 ring-black/10 transition hover:scale-105 focus:outline-none focus:ring-2 focus:ring-indigo-500" aria-label="Changer de thème" aria-pressed="false"></button>

<div class="flex items-center justify-center min-h-screen px-4 py-8 sm:px-6">
    <div class="login-card w-full max-w-xl bg-white p-5 sm:p-6 rounded-lg shadow-md dark:shadow-black/20">
        <div class="text-center">
            <p class="text-lg font-semibold text-indigo-600 dark:text-indigo-400">Administration | Gestion</p>
            <h1 class="login-title mt-3 text-3xl sm:text-4xl md:text-5xl font-bold text-gray-900 dark:text-gray-100">Connexion</h1>
            <span class="login-subtitle mt-4 block text-base sm:text-lg md:text-2xl text-gray-600 dark:text-gray-300">Connectez-vous pour accéder au panneau d'administration.</span>
            <div class="mt-8">
                <form id="loginForm" class="flex flex-col items-center justify-center">
                    <label for="username" class="sr-only">Identifiant ou E-mail</label>
                    <input type="text" id="username" name="username" autocomplete="username webauthn" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Nom d'utilisateur ou Adresse e-mail" class="w-full px-4 py-2 border border-gray-300 rounded-md bg-white text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100 dark:placeholder:text-gray-500">
                    <label for="password" class="sr-only">Mot de passe</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Mot de passe" class="w-full px-4 py-2 border border-gray-300 rounded-md bg-white text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100 dark:placeholder:text-gray-500">
                    <span id="connect-msg" class="text-sm mb-4 text-red-500 dark:text-red-400"></span>
                    <button id="submit-btn" type="button" class="w-full rounded-md bg-indigo-600 px-6 py-3 text-base font-semibold text-white shadow-md hover:cursor-pointer hover:bg-indigo-500 transition dark:hover:bg-indigo-400">Se connecter</button>
                    <div id="passkey-block" class="mt-4 hidden w-full">
                        <div class="mb-3 flex items-center gap-3">
                            <span class="h-px flex-1 bg-gray-300 dark:bg-gray-600"></span>
                            <span class="text-xs text-gray-500 dark:text-gray-400">ou</span>
                            <span class="h-px flex-1 bg-gray-300 dark:bg-gray-600"></span>
                        </div>
                        <button id="passkey-btn" type="button" class="w-full rounded-md border border-indigo-500 px-6 py-3 text-base font-semibold text-indigo-600 transition hover:cursor-pointer hover:bg-indigo-50 dark:text-indigo-400 dark:hover:bg-indigo-500/10">Se connecter avec une passkey</button>
                        <p id="passkey-state" class="mt-2 text-xs text-gray-500 dark:text-gray-400"></p>
                    </div>
                </form>
            </div>
            <span class="login-footer mt-6 text-sm font-semibold text-gray-900 dark:text-gray-100">©FileTransfer - Tous droits réservés</span>
        </div>
    </div>
</div>

<script>
    const THEME_KEY = 'ft-theme';

    const moonIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>`;
    const sunIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>`;

    function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);
        const button = document.getElementById('themeToggle');
        if (button) {
            button.innerHTML = isDark ? sunIcon : moonIcon;
            button.setAttribute('aria-pressed', String(isDark));
            button.setAttribute('aria-label', isDark ? 'Passer au thème clair' : 'Passer au thème sombre');
        }
    }

    function initTheme() {
        const savedTheme = localStorage.getItem(THEME_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
    }

    function toggleTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        applyTheme(isDark ? 'light' : 'dark');
    }

    function setCookie(name, value, days) {
        let expires = "";
        if (days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/";
    }

    function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(';');
        for(let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
        }
        return null;
    }

    function eraseCookie(name) {
        document.cookie = name + '=; Max-Age=-99999999; path=/';
    }

    function getResponseMessage(data) {
        if (typeof data === 'string') {
            try { const p = JSON.parse(data); return p.message || data; } catch { return data; }
        }
        if (data && typeof data.message === 'string') return data.message;
        return '';
    }

    initTheme();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    const connectMsg = document.getElementById('connect-msg');
    function fail(message) {
        connectMsg.innerHTML = "<span class='text-red-500'>" + message + "</span>";
    }
    function info(message) {
        connectMsg.innerHTML = "<span class='text-green-500'>" + message + "</span>";
    }

    // L'ancienne version conservait le nom d'utilisateur ET le mot de passe en
    // clair dans des cookies lisibles en JavaScript. On les efface au chargement :
    // la session est desormais un cookie HttpOnly pose par le serveur.
    ['admin_username', 'admin_password'].forEach(function (name) {
        document.cookie = name + '=; Max-Age=-99999999; path=/';
    });

    /* --- Passkeys --- */
    function b64urlToBuf(str) {
        str = String(str).replace(/-/g, '+').replace(/_/g, '/');
        while (str.length % 4) str += '=';
        const bin = atob(str);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        return buf.buffer;
    }
    function bufToB64url(buf) {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    const passkeysSupported = !!(window.PublicKeyCredential && navigator.credentials);
    if (passkeysSupported) {
        document.getElementById('passkey-block').classList.remove('hidden');
    }

    // Une seule ceremonie WebAuthn peut etre en vol a la fois : la demande
    // conditionnelle reste ouverte en arriere-plan, il faut donc l'annuler avant
    // d'en lancer une explicite.
    let conditionalAbort = null;
    function cancelConditional() {
        if (conditionalAbort) {
            conditionalAbort.abort();
            conditionalAbort = null;
        }
    }

    // pending non vide : le mot de passe a deja ete accepte et le compte exige
    // en plus une passkey (politique « deux facteurs »).
    async function passkeyCeremony(pending, conditional) {
        const query = pending ? '?pending=' + encodeURIComponent(pending) : '';
        const beginRes = await fetch('/admin/webauthn/login/begin' + query, {
            method: 'POST', credentials: 'same-origin'
        });
        const begin = await beginRes.json();
        if (!beginRes.ok) throw new Error(begin.error || 'Ceremonie impossible');

        const opts = begin.options;
        opts.challenge = b64urlToBuf(opts.challenge);
        (opts.allowCredentials || []).forEach(function (c) { c.id = b64urlToBuf(c.id); });

        const request = { publicKey: opts };
        if (conditional) {
            // mediation conditionnelle : la passkey est proposee dans la liste
            // d'autocompletion du champ identifiant, sans fenetre modale. C'est
            // ce que Bitwarden, iCloud et les navigateurs attendent pour
            // signaler qu'une passkey existe pour ce site.
            conditionalAbort = new AbortController();
            request.mediation = 'conditional';
            request.signal = conditionalAbort.signal;
        } else {
            cancelConditional();
        }

        const assertion = await navigator.credentials.get(request);
        const payload = {
            id: assertion.id,
            rawId: bufToB64url(assertion.rawId),
            type: assertion.type,
            clientExtensionResults: assertion.getClientExtensionResults(),
            response: {
                authenticatorData: bufToB64url(assertion.response.authenticatorData),
                clientDataJSON: bufToB64url(assertion.response.clientDataJSON),
                signature: bufToB64url(assertion.response.signature),
                userHandle: assertion.response.userHandle ? bufToB64url(assertion.response.userHandle) : ''
            }
        };

        let finishURL = '/admin/webauthn/login/finish?ceremony=' + encodeURIComponent(begin.ceremony);
        if (pending) finishURL += '&pending=' + encodeURIComponent(pending);

        const res = await fetch(finishURL, {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Passkey refusee');
        return data;
    }

    document.getElementById('passkey-btn').addEventListener('click', async function () {
        connectMsg.textContent = '';
        try {
            await passkeyCeremony('', false);
            info('Connexion reussie');
            window.location.href = '/admin/dashboard';
        } catch (e) {
            if (e && e.name === 'AbortError') return;
            fail(e.message || 'Connexion par passkey annulee');
        }
    });

    // Autocompletion des passkeys : proposee des le chargement de la page, sans
    // clic. Sans cet appel, aucun gestionnaire de mots de passe ne peut savoir
    // que le site accepte les passkeys.
    const stateLine = document.getElementById('passkey-state');
    function state(text) {
        stateLine.textContent = text;
        console.log('[passkey] ' + text);
    }

    (async function armConditionalPasskey() {
        if (!passkeysSupported) {
            state("Passkeys non gérées par ce navigateur (HTTPS requis).");
            return;
        }
        if (typeof PublicKeyCredential.isConditionalMediationAvailable !== 'function') {
            state("Ce navigateur ne gère pas l'autocomplétion des passkeys. Utilisez le bouton ci-dessus.");
            return;
        }
        try {
            if (!(await PublicKeyCredential.isConditionalMediationAvailable())) {
                state("Autocomplétion des passkeys indisponible ici. Utilisez le bouton ci-dessus.");
                return;
            }
            state("Autocomplétion active — touchez le champ identifiant pour choisir votre passkey.");

            await passkeyCeremony('', true);
            info('Connexion reussie');
            window.location.href = '/admin/dashboard';
        } catch (e) {
            // Une annulation volontaire ou le passage au mot de passe ne sont pas
            // des erreurs : on ne les signale pas. Le reste, si.
            if (e && (e.name === 'AbortError' || e.name === 'NotAllowedError')) {
                state('');
                return;
            }
            state('Autocomplétion indisponible : ' + (e && (e.message || e.name) || 'raison inconnue'));
        }
    })();

    /* --- Mot de passe --- */
    document.addEventListener('keyup', function (e) {
        if (e.key === 'Enter') document.getElementById('submit-btn').click();
    });

    document.getElementById('submit-btn').onclick = async function (e) {
        e.preventDefault();
        connectMsg.textContent = '';

        cancelConditional();
        const identifier = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!identifier || !password) {
            fail('Renseignez votre identifiant et votre mot de passe');
            return;
        }

        try {
            const res = await fetch('/admin/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ action: 'login', username: identifier, password: password })
            });
            const data = await res.json();
            if (!res.ok) {
                fail(data.error || 'Identifiants incorrects');
                return;
            }

            if (data.status === 'PASSKEY_REQUIRED') {
                if (!passkeysSupported) {
                    fail('Ce compte exige une passkey, mais ce navigateur ne les gere pas');
                    return;
                }
                info('Mot de passe accepte — validez avec votre passkey');
                await passkeyCeremony(data.pending, false);
            }

            window.location.href = '/admin/dashboard';
        } catch (err) {
            fail(err.message || 'Erreur de connexion au serveur');
        }
    };
</script>
</body>
</html>
