<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Utilisateur - S'inscrire</title>
  <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<div class="flex items-center justify-center min-h-screen bg-gray-100 px-4">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-2xl">
    <div class="text-center">
      <p class="text-lg font-semibold text-indigo-600">File Transfer | Administration</p>
      <h1 class="mt-4 text-5xl md:text-5xl font-bold text-gray-900">Création de compte</h1>
      <span class="mt-6 text-2xl text-gray-600">Inscrivez-vous pour gérer le site. (Vérification manuelle)</span>
      <div class="mt-11">
        <form id="signinForm" class="flex flex-col items-center justify-center">
          <div class="flex space-x-4 w-full">
            <input type="text" id="firstname" name="firstname" placeholder="Prénom*" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4">
            <input type="text" id="lastname" name="lastname" placeholder="Nom*" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4">
          </div>
          <input type="text" id="inviteCode" name="inviteCode" placeholder="Code d'invitation*" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4">
          <input type="text" id="username" name="username" placeholder="Nom d'utilisateur*" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4">
          <input type="email" id="email" name="email" placeholder="Adresse email*" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4">
          <input type="password" id="password" name="password" placeholder="Mot de passe*" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4">
          <span id="connect-msg" class="text-red-500 text-sm mb-4"></span>
          <button id="submit-btn" type="button" class="w-full rounded-md bg-indigo-600 px-6 py-3 text-base font-semibold text-white shadow-md hover:cursor-pointer hover:bg-indigo-500 transition">Créer un compte</button>
        </form>
      </div>
      <a href="/admin/login" class="mt-6 text-sm text-indigo-500">J'ai déjà un compte</a>
    </div>
  </div>
</div>

<script>
  function getResponseMessage(data) {
    if (typeof data === 'string') {
      try { const p = JSON.parse(data); return p.message || data; } catch { return data; }
    }
    if (data && typeof data.message === 'string') return data.message;
    return '';
  }

  function setCookie(name, value, days) {
    let expires = "";
    if (days) {
      const date = new Date();
      date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
      expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/";
  }

  function getCookie(name) {
    const nameEQ = name + "=";
    const ca = document.cookie.split(';');
    for(let i = 0; i < ca.length; i++) {
      let c = ca[i];
      while (c.charAt(0) === ' ') c = c.substring(1, c.length);
      if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
    }
    return null;
  }

  function eraseCookie(name) {
    document.cookie = name + '=; Max-Age=-99999999; path=/';
  }

  document.addEventListener('keyup', function(e) {
    if (e.key === 'Enter') document.getElementById('submit-btn').click();
  });

  document.getElementById('submit-btn').onclick = function(e) {
    e.preventDefault();

    const firstName = document.getElementById('firstname').value.trim();
    const lastName = document.getElementById('lastname').value.trim();
    const inviteCode = document.getElementById('inviteCode').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const connectMsg = document.getElementById('connect-msg');
    connectMsg.textContent = '';

    fetch('/admin/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'register',
        firstName,
        lastName,
        inviteCode,
        username,
        email,
        password
      })
    })
    .then(res => res.json())
    .then(data => {
      const msg = getResponseMessage(data);

      if (msg === 'USER_CREATED_SUCCESSFULLY') {
        connectMsg.innerHTML = "<span class='text-green-500'>Compte créé avec succès.</span>";
        setTimeout(() => { window.location.href = '/admin/login'; }, 1500);
      } else {
        connectMsg.innerHTML = "<span class='text-red-500'>" + (msg || 'La création du compte a échoué.') + "</span>";
      }
    })
    .catch(error => {
      console.error(error);
      connectMsg.textContent = 'Impossible de contacter le serveur.';
    });
  };
</script>
</body>
</html>
