<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://file.titino.app/KnexMg?preview=true" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html[data-theme="light"] body { background-color: #f3f4f6 !important; color: #111827 !important; }
        html[data-theme="dark"] body { background-color: #0f172a !important; color: #f8fafc !important; }
        html[data-theme="light"] h1 { color: #111827 !important; }
        html[data-theme="dark"] h1 { color: #f8fafc !important; }
        html[data-theme="light"] .theme-subtitle { color: #4b5563 !important; }
        html[data-theme="dark"] .theme-subtitle { color: #cbd5e1 !important; }
        html[data-theme="light"] .theme-label { color: #1f2937 !important; }
        html[data-theme="dark"] .theme-label { color: #e5e7eb !important; }
        html[data-theme="light"] #password { background-color: #ffffff !important; color: #111827 !important; border-color: #d1d5db !important; }
        html[data-theme="dark"] #password { background-color: #1f2937 !important; color: #f8fafc !important; border-color: #4b5563 !important; }
        html[data-theme="light"] #downloadBtn { background-color: #4f46e5 !important; color: #ffffff !important; }
        html[data-theme="dark"] #downloadBtn { background-color: #818cf8 !important; color: #111827 !important; }
        html[data-theme="light"] #virustotalBtn { background-color: #365314 !important; color: #ffffff !important; }
        html[data-theme="dark"] #virustotalBtn { background-color: #84cc16 !important; color: #111827 !important; }
        html[data-theme="light"] #virusTotalmsg { color: #374151 !important; }
        html[data-theme="dark"] #virusTotalmsg { color: #d1d5db !important; }
        html[data-theme="light"] footer { color: #6b7280 !important; }
        html[data-theme="dark"] footer { color: #94a3b8 !important; }
        html[data-theme="light"] #themeToggle { background-color: #000000 !important; color: #ffffff !important; }
        html[data-theme="dark"] #themeToggle { background-color: #ffffff !important; color: #000000 !important; }
    </style>
    <title>Téléchargement de fichier</title>
</head>
<body class="flex flex-col min-h-screen bg-gray-100 text-gray-900 transition-colors duration-200 dark:bg-gray-900 dark:text-gray-100">

<button id="themeToggle" type="button" class="fixed bottom-4 right-4 z-50 flex h-14 w-14 items-center justify-center rounded-full shadow-xl ring-1 ring-black/10 transition hover:scale-105 focus:outline-none focus:ring-2 focus:ring-indigo-500" aria-label="Changer de thème" aria-pressed="false"></button>

<!-- Contenu principal -->
<main class="flex-grow flex items-center justify-center">
    <div class="text-center">
        <p class="text-lg font-semibold text-indigo-600 dark:text-indigo-400">TeanoLink | Layttos</p>
        <h1 class="mt-4 text-5xl md:text-5xl font-bold text-gray-900 dark:text-gray-100">Télécharger un fichier</h1>
        <span class="theme-subtitle mt-6 text-2xl">Cliquez sur "Télécharger le fichier" pour récupérer votre fichier.</span>
        <div class="space-y-4">
            <div class="mt-6">
                <p class="theme-label text-lg font-semibold">Nom du fichier : <span id="fileName" class="text-base text-blue-600 dark:text-blue-400"></span></p>
                <p class="theme-label text-lg font-semibold">Taille du fichier : <span id="fileSize" class="text-base text-blue-600 dark:text-blue-400"></span></p>
            </div>
            <div class="mt-6">
                <label for="password" class="sr-only">Mot de passe du fichier</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mot de passe (optionnel)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md bg-white text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:placeholder:text-gray-500"
                >
            </div>
            <div class="flex justify-center gap-4 mt-6">
                <a id="downloadBtn" class="rounded-md bg-indigo-600 px-6 py-3 text-base font-semibold text-white shadow-md hover:bg-indigo-500 hover:cursor-pointer transition dark:hover:bg-indigo-400">
                    Télécharger le fichier
                </a>
                <a id="virustotalBtn" class="rounded-md bg-lime-700 px-6 py-3 text-base font-semibold text-white shadow-md hover:bg-green-600 hover:cursor-pointer transition dark:hover:bg-lime-500">
                    Vérifier sur VirusTotal
                </a>
            </div>
        </div>
        <span id="virusTotalmsg" class="mt-4 block text-gray-700 dark:text-gray-300"><br/></span>
    </div>
</main>

<footer class="text-center text-gray-500 mt-auto py-4 dark:text-gray-400">
    FTransfer - Version 2.0
</footer>

<script>
    const THEME_KEY = 'ft-theme';
    const url = window.location.href;

    const moonIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
        </svg>`;

    const sunIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>`;

    function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);
        const button = document.getElementById('themeToggle');
        if (button) {
            button.innerHTML = isDark ? sunIcon : moonIcon;
            button.setAttribute('aria-pressed', String(isDark));
            button.setAttribute('aria-label', isDark ? 'Passer au thème clair' : 'Passer au thème sombre');
            button.classList.remove('bg-black', 'text-white', 'bg-white', 'text-black');
            button.classList.add(isDark ? 'bg-white' : 'bg-black', isDark ? 'text-black' : 'text-white');
        }
    }

    function initTheme() {
        const savedTheme = localStorage.getItem(THEME_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
    }

    function toggleTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        applyTheme(isDark ? 'light' : 'dark');
    }

    initTheme();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    fetch(url + `?jsonInfo=only`)
        .then(response => response.json())
        .then(data => {
            console.log(data);
            document.getElementById('fileName').textContent = data.filename;
            document.getElementById('fileSize').textContent = data.size;
        });
    const passwordInput = document.getElementById('password');
    const downloadBtn = document.getElementById('downloadBtn');
    const virustotalBtn = document.getElementById('virustotalBtn');

    downloadBtn.addEventListener('click', async function(e) {
        e.preventDefault(); // Empêche le comportement par défaut du bouton

        const password = passwordInput.value.trim();
        const headers = new Headers();

        // On ajoute le mot de passe dans un Header personnalisé si l'input n'est pas vide
        if (password !== '') {
            headers.append('X-File-Password', password);
        }

        try {
            const response = await fetch(url + "?download=true", {
                method: 'GET',
                headers: headers
            });

            // Gestion de l'erreur (ex: mauvais mot de passe)
            if (!response.ok) {
                const errorData = await response.json();
                alert(errorData.error || "Erreur de téléchargement");
                return;
            }

            // Le fichier est valide, on lance le téléchargement
            const blob = await response.blob();

            // Extraction du nom de fichier envoyé par ton serveur Go
            let filename = "download";
            const disposition = response.headers.get('Content-Disposition');
            if (disposition && disposition.includes('filename=')) {
                filename = disposition.split('filename=')[1].replace(/["']/g, '');
            }

            // Création du lien de téléchargement invisible
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click(); // Télécharge le fichier

            // Nettoyage
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

        } catch (error) {
            console.error("Erreur réseau :", error);
            alert("Impossible de joindre le serveur.");
        }
    });

    virustotalBtn.onclick = function() {
        fetch(url + `?virusTotal=scan`)
            .then(response => response.json())
            .then(async data => {
                console.log(await data);
                document.getElementById('virusTotalmsg').innerHTML = `<span class="text-lg text-gray-700 dark:text-lime-500">Fichier safe à : <span class="text-lg text-indigo-600 dark:text-indigo-400">${100 - Math.round(parseInt(data["malicious"])*100/69)}%</span></span>`
            });
    };

    // Initial setup
    function updateDownloadButton() {
        if (passwordInput.value.trim() !== '') {
            downloadBtn.onclick = function() {
                const password = passwordInput.value;
                window.location.href = url + `?download=true&password=${password}`;
            };
        } else {
            downloadBtn.onclick = function() {
                window.location.href = url + `?download=true`;
            };
        }
    }

    passwordInput.addEventListener('input', updateDownloadButton);
    updateDownloadButton();
</script>

</body>
</html>
